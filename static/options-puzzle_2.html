<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>選擇權拼圖</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f1e7; --paper:#fffdf8; --ink:#1f2430; --muted:#6b6f7a; --line:#e3dccd;
    --call:#2f6fd6; --put:#d2542f; --stock:#2e9a63; --target:#9aa0ab; --sum:#1f2430;
    --ok:#2e9a63; --radius:14px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC",system-ui,sans-serif;line-height:1.5}
  header{padding:22px 24px 6px;max-width:1180px;margin:0 auto;display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
  h1{font-size:26px;font-weight:900;margin:0;letter-spacing:.02em}
  h1 span{color:var(--call)}
  .sub{color:var(--muted);font-size:14px;margin:2px 0 0}
  .levels{display:flex;gap:6px;flex-wrap:wrap}
  .lvbtn{border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:4px 11px;font:inherit;font-size:13px;cursor:pointer;color:var(--muted)}
  .lvbtn.cur{border-color:var(--ink);color:var(--ink);font-weight:700}
  .lvbtn.done{background:#e3f3ea;border-color:#b9dfc8;color:#1f6b44}
  main{max-width:1180px;margin:0 auto;padding:12px 24px 40px;display:grid;grid-template-columns:270px 1fr;gap:18px}
  @media (max-width:860px){main{grid-template-columns:1fr}}
  .card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
  .tray h2,.board h2{font-size:14px;margin:0 0 10px;color:var(--muted);font-weight:700;letter-spacing:.06em}
  .pieces{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .piece{position:relative;border:2px solid currentColor;border-radius:10px;padding:8px 8px 6px;cursor:grab;background:#fff;user-select:none;transition:transform .12s, box-shadow .12s}
  .piece:hover{transform:translateY(-2px);box-shadow:0 4px 10px rgba(0,0,0,.08)}
  .piece:active{cursor:grabbing}
  .piece.banned{opacity:.3;cursor:not-allowed;filter:grayscale(1)}
  .piece.banned::after{content:"本關禁用";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#000}
  /* puzzle tab */
  .piece::before{content:"";position:absolute;right:-9px;top:50%;width:14px;height:14px;margin-top:-7px;border-radius:50%;background:#fff;border:2px solid currentColor;border-left-color:transparent;border-bottom-color:transparent;transform:rotate(45deg)}
  .piece .nm{font-weight:700;font-size:14px;color:var(--ink)}
  .piece .en{font-size:11px;color:var(--muted)}
  .piece svg{display:block;width:100%;height:38px;margin-top:4px}
  .c-digital{color:#8a4fd6} .c-call{color:var(--call)} .c-put{color:var(--put)} .c-stock{color:var(--stock)}
  .tip{font-size:12px;color:var(--muted);margin-top:12px}
  .right{display:flex;flex-direction:column;gap:18px;min-width:0}
  .mission{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
  .mission .lv{font-size:12px;font-weight:700;color:var(--call);letter-spacing:.08em}
  .mission h3{margin:2px 0 4px;font-size:20px}
  .mission p{margin:0;color:var(--muted);font-size:14px;max-width:640px}
  .btns{display:flex;gap:8px;flex-wrap:wrap}
  button.b{font:inherit;font-size:13px;border-radius:8px;padding:6px 12px;border:1.5px solid var(--ink);background:#fff;cursor:pointer}
  button.b.pri{background:var(--ink);color:#fff}
  button.b:disabled{opacity:.35;cursor:default}
  .chartwrap{position:relative}
  #chart{width:100%;height:auto;display:block}
  .legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:6px}
  .legend i{display:inline-block;width:22px;height:0;border-top:3px solid;vertical-align:middle;margin-right:5px}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
  .stat{background:var(--bg);border-radius:10px;padding:8px 10px}
  .stat .k{font-size:11px;color:var(--muted)} .stat .v{font-weight:700;font-size:15px}
  .board{min-height:140px}
  .drop{border:2px dashed var(--line);border-radius:12px;min-height:96px;padding:10px;display:flex;flex-wrap:wrap;gap:10px;align-content:flex-start;transition:background .15s,border-color .15s}
  .drop.over{background:#eef4ff;border-color:var(--call)}
  .drop .empty{color:var(--muted);font-size:13px;margin:auto}
  .placed{display:flex;align-items:center;gap:8px;border:2px solid currentColor;border-radius:10px;padding:6px 8px;background:#fff;animation:pop .2s ease}
  @keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
  .placed.far{border-style:dashed}
  .named{display:none;margin-top:10px;padding:8px 12px;border-radius:10px;background:#eef4ff;border:1px solid #c9dafa;font-size:14px}
  .named.show{display:block}
  .placed .nm{font-weight:700;font-size:13px;color:var(--ink)}
  .placed select{font:inherit;font-size:13px;border:1px solid var(--line);border-radius:6px;padding:1px 4px;background:#fff}
  .qty{display:flex;align-items:center;gap:2px;color:var(--ink);font-size:13px}
  .qty button,.x{width:22px;height:22px;border-radius:6px;border:1px solid var(--line);background:#fff;cursor:pointer;font:inherit;font-size:13px;line-height:1;padding:0;color:var(--ink)}
  .x{border:none;color:var(--muted)}
  .prem{font-size:11px;color:var(--muted)}
  .win{display:none;margin-top:12px;border-radius:12px;padding:12px 14px;background:#e3f3ea;border:1px solid #b9dfc8}
  .win.show{display:block;animation:pop .25s ease}
  .win b{color:#1f6b44}
  .win p{margin:4px 0 0;font-size:14px}
  .hint{display:none;margin-top:10px;font-size:13px;background:#fff6dd;border:1px solid #f0dfa6;border-radius:10px;padding:8px 12px}
  .hint.show{display:block}
  .hint div+div{margin-top:4px}
  main.drawmode{grid-template-columns:1fr}
  main.drawmode .tray{display:none}
  #chart.drawable{cursor:crosshair;touch-action:none}
  .presets{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .presets .lab{font-size:13px;color:var(--muted);margin-right:4px}
  .seg{display:inline-flex;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
  .seg button{font:inherit;font-size:13px;border:none;background:#fff;padding:5px 10px;cursor:pointer}
  .seg button.on{background:var(--ink);color:#fff}
  .recipe{margin-top:12px;font-size:14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:6px}
  .recipe div{background:var(--bg);border-radius:8px;padding:5px 9px}
  .recipe .buy{color:#1f6b44} .recipe .sell{color:#a33d1f}
  #qchart{width:100%;height:auto;display:block;margin-top:10px}
  .note{font-size:13px;color:var(--muted);margin-top:8px}
  .foot{max-width:1180px;margin:0 auto;padding:0 24px 30px;font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<header>
  <div>
    <h1>選擇權<span>拼圖</span></h1>
    <p class="sub">把零件拖進拼盤（或直接點一下），讓粗黑線疊成灰色虛線的形狀。圖上是到期日損益（已扣權利金）。</p>
  </div>
  <div class="levels" id="levels"></div>
</header>

<main id="main">
  <section class="card tray">
    <h2>零件盒</h2>
    <div class="pieces" id="tray"></div>
    <div class="tip" id="trayTip">現價 S₀ = 100　波動率 25%　距到期 3 個月　利率 0<br>權利金由 Black-Scholes 計算，所以等價關係會剛好成立。</div>
  </section>

  <div class="right">
    <section class="card">
      <div class="mission">
        <div>
          <div class="lv" id="lvTag"></div>
          <h3 id="lvTitle"></h3>
          <p id="lvStory"></p>
        </div>
        <div class="btns">
          <button class="b" id="hintBtn">提示</button>
          <button class="b" id="clearBtn">清空</button>
          <button class="b pri" id="nextBtn" disabled>下一關 →</button>
        </div>
      </div>
      <div class="hint" id="hint"></div>
      <div class="chartwrap" style="margin-top:12px">
        <svg id="chart" viewBox="0 0 720 360"></svg>
      </div>
      <div class="legend" id="legend">
        <span><i style="border-color:var(--target);border-top-style:dashed"></i>目標形狀</span>
        <span><i style="border-color:var(--sum)"></i>你拼出來的合計</span>
        <span><i style="border-color:#c9ccd3;border-top-width:2px"></i>各零件（疊加前）</span>
      </div>
      <div class="stats">
        <div class="stat"><div class="k" id="k1">最大獲利</div><div class="v" id="stMax">—</div></div>
        <div class="stat"><div class="k" id="k2">最大虧損</div><div class="v" id="stMin">—</div></div>
        <div class="stat"><div class="k" id="k3">損益兩平點</div><div class="v" id="stBe">—</div></div>
      </div>
      <div class="named" id="named"></div>
      <div class="win" id="win"></div>
    </section>

    <section class="card" id="drawSec" style="display:none">
      <h2 style="font-size:14px;margin:0 0 10px;color:var(--muted);letter-spacing:.06em">畫筆與配方</h2>
      <div class="presets">
        <span class="lab">範例形狀：</span>
        <button class="b" data-pre="semi">半圓</button>
        <button class="b" data-pre="smile">微笑</button>
        <button class="b" data-pre="step">階梯</button>
        <button class="b" data-pre="saw">鋸齒</button>
        <button class="b" data-pre="sine">波浪</button>
        <button class="b" data-pre="cake">🎂 蛋糕</button>
        <button class="b" data-pre="zero">清空</button>
      </div>
      <div class="presets" style="margin-top:10px">
        <span class="lab">履約價間距：</span>
        <span class="seg" id="gapSeg"><button data-gap="10">10</button><button data-gap="5">5</button><button data-gap="2.5">2.5</button><button data-gap="1">1</button></span>
        <span class="lab" style="margin-left:6px">間距越小，折線越像你畫的線，但需要的選擇權也越多。</span>
      </div>
      <div style="margin-top:14px;font-size:13px;font-weight:700">每個履約價的口數（向上 = 買進，向下 = 賣出）</div>
      <svg id="qchart" viewBox="0 0 720 200"></svg>
      <div class="recipe" id="recipe"></div>
      <div class="note" id="drawNote"></div>
    </section>

    <section class="card board" id="boardSec">
      <h2>拼盤</h2>
      <div class="drop" id="drop"></div>
    </section>
  </div>
</main>
<div class="foot">教學原型：只呈現到期日損益，不含時間價值與 Greeks 的變化。不構成投資建議。</div>

<script src="/static/optpuzzle-session.js"></script>
<script>
const S0 = 100, SIG = 0.25, T = 0.25;
const STRIKES = [80, 85, 90, 95, 100, 105, 110, 115, 120];
const XMIN = 60, XMAX = 140;

function erf(x){ // Abramowitz-Stegun
  const s = Math.sign(x); x = Math.abs(x);
  const t = 1/(1+0.3275911*x);
  const y = 1-(((((1.061405429*t-1.453152027)*t)+1.421413741)*t-0.284496736)*t+0.254829592)*t*Math.exp(-x*x);
  return s*y;
}
const N = x => 0.5*(1+erf(x/Math.SQRT2));
function callPx(K, t=T){
  const d1 = (Math.log(S0/K)+0.5*SIG*SIG*t)/(SIG*Math.sqrt(t));
  const d2 = d1 - SIG*Math.sqrt(t);
  return S0*N(d1) - K*N(d2);
}
const putPx = (K, t=T) => callPx(K, t) - S0 + K; // put-call parity, r = 0
const DPAY = 10; // digital (cash-or-nothing) call pays 10 if S > K at expiry
function digitalPx(K, t=T){ const d2 = (Math.log(S0/K)-0.5*SIG*SIG*t)/(SIG*Math.sqrt(t)); return DPAY*N(d2); }
// ── 不同到期日：近月 T、遠月 T2。圖上一律是「近月到期那天」的損益 ──
const T2 = 0.5;
function bsCall(S, K, t){
  if (t <= 1e-9) return Math.max(S-K, 0);
  const d1 = (Math.log(S/K)+0.5*SIG*SIG*t)/(SIG*Math.sqrt(t));
  return S*N(d1) - K*N(d1-SIG*Math.sqrt(t));
}
const bsPut = (S, K, t) => bsCall(S, K, t) - S + K;
const matOf = p => p.m==='far' ? T2 : T;
const priceOf = p => TYPES[p.t].kind==='call' ? callPx(p.K, matOf(p)) : TYPES[p.t].kind==='put' ? putPx(p.K, matOf(p)) : digitalPx(p.K);

const TYPES = {
  LC:{nm:'買進買權', en:'Long Call',  kind:'call', sign:+1, cls:'c-call'},
  SC:{nm:'賣出買權', en:'Short Call', kind:'call', sign:-1, cls:'c-call'},
  LP:{nm:'買進賣權', en:'Long Put',   kind:'put',  sign:+1, cls:'c-put'},
  SP:{nm:'賣出賣權', en:'Short Put',  kind:'put',  sign:-1, cls:'c-put'},
  LS:{nm:'買進現貨', en:'Long Stock', kind:'stock',sign:+1, cls:'c-stock'},
  LD:{nm:'買進數位買權', en:'Digital Call：漲過履約價就拿 10', kind:'digital', sign:+1, cls:'c-digital'},
  SD:{nm:'賣出數位買權', en:'Short Digital：漲過就付 10', kind:'digital', sign:-1, cls:'c-digital'},
  SS:{nm:'放空現貨', en:'Short Stock',kind:'stock',sign:-1, cls:'c-stock'},
};
const ORDER = ['LC','SC','LP','SP','LS','SS','LD','SD'];

function pnl(p, S){
  const t = TYPES[p.t], q = p.q || 1;
  if (t.kind==='stock') return t.sign*(S-S0)*q;
  if (t.kind==='digital') return t.sign*((S>p.K?DPAY:0)-digitalPx(p.K))*q;
  const tau = matOf(p) - T; // 近月到期那天，這片還剩多久
  if (t.kind==='call')  return t.sign*(bsCall(S,p.K,tau)-callPx(p.K,matOf(p)))*q;
  return t.sign*(bsPut(S,p.K,tau)-putPx(p.K,matOf(p)))*q;
}
const total = (ps, S) => ps.reduce((a,p)=>a+pnl(p,S),0);
const NM = {"synLong": "合成現貨 Synthetic Long Stock", "synShort": "合成空頭 Synthetic Short Stock", "longCall": "買進買權 Long Call", "protPut": "保護性賣權 Protective Put（形狀等同買進買權）", "longPut": "買進賣權 Long Put", "shortCall": "賣出買權 Short Call", "shortPut": "賣出賣權 Short Put（形狀等同掩護性買權）", "covCall": "掩護性買權 Covered Call（形狀等同賣出賣權）", "straddle": "跨式 Long Straddle", "shortStraddle": "賣出跨式 Short Straddle", "strap": "Strap 偏多跨式（2 買權 + 1 賣權）", "strip": "Strip 偏空跨式（1 買權 + 2 賣權）", "bull": "多頭價差 Bull Spread", "collar": "領口 Collar（形狀等同多頭價差）", "bear": "空頭價差 Bear Spread", "strangle": "寬跨式 Long Strangle", "shortStrangle": "賣出寬跨式 Short Strangle", "ratio": "比率價差 Ratio Spread", "backspread": "逆比率價差 Backspread", "putRatio": "賣權比率價差 Put Ratio Spread", "putBack": "賣權逆比率價差 Put Backspread", "trf": "TRF 目標可贖回遠期（單一結算期）", "fly": "蝶式 Butterfly", "ironFly": "鐵蝶式 Iron Butterfly（形狀等同蝶式）", "brokenFly": "斷翅蝶式 Broken-wing Butterfly", "shortFly": "賣出蝶式 Short Butterfly", "revIronFly": "反向鐵蝶式 Reverse Iron Butterfly", "ladder": "聖誕樹／階梯 Christmas Tree (Ladder)", "seagull": "海鷗 Seagull", "jade": "翡翠蜥蜴 Jade Lizard", "condor": "兀鷹（禿鷹）Condor", "ironCondor": "鐵兀鷹（鐵禿鷹）Iron Condor（形狀等同兀鷹）", "shortCondor": "賣出兀鷹 Short Condor", "revIronCondor": "反向鐵兀鷹 Reverse Iron Condor", "doubleFly": "雙蝶式 Double Butterfly", "cal": "時間價差 Calendar Spread", "revCal": "反向時間價差 Reverse Calendar Spread", "diag": "對角價差 Diagonal Spread", "dblCal": "雙時間價差 Double Calendar", "dblDiag": "雙對角價差 Double Diagonal"};
const NAMED_PFX = "這個組合叫：";

// ── 著名組合辨識：用到期損益的「轉彎」（各履約價的斜率變化）判斷形狀 ──
function kinkSig(ps){
  if (ps.some(p=>TYPES[p.t].kind==='digital')) return null;
  let L = 0; const k = {};
  ps.forEach(p=>{ const ty = TYPES[p.t], q = (p.q||1)*ty.sign;
    if (ty.kind==='stock'){ L += q; return; }
    if (ty.kind==='put') L -= q;
    k[p.K] = (k[p.K]||0) + q; });
  const K = Object.keys(k).map(Number).filter(x=>Math.abs(k[x])>1e-9).sort((a,b)=>a-b);
  return {L, K, a:K.map(x=>k[x])};
}
const RULES = [
  {L:1,  a:[],        f:(K,o)=>o.stock?null:NM.synLong},
  {L:-1, a:[],        f:(K,o)=>o.stock?null:NM.synShort},
  {L:0,  a:[1],       f:(K,o)=>o.stock?NM.protPut:NM.longCall},
  {L:-1, a:[1],       f:()=>NM.longPut},
  {L:0,  a:[-1],      f:()=>NM.shortCall},
  {L:1,  a:[-1],      f:(K,o)=>o.stock?NM.covCall:NM.shortPut},
  {L:-1, a:[2],       f:()=>NM.straddle},
  {L:1,  a:[-2],      f:()=>NM.shortStraddle},
  {L:-1, a:[3],       f:()=>NM.strap},
  {L:-2, a:[3],       f:()=>NM.strip},
  {L:0,  a:[1,-1],    f:(K,o)=>o.stock?NM.collar:NM.bull},
  {L:0,  a:[-1,1],    f:()=>NM.bear},
  {L:-1, a:[1,1],     f:()=>NM.strangle},
  {L:1,  a:[-1,-1],   f:()=>NM.shortStrangle},
  {L:0,  a:[1,-2],    f:()=>NM.ratio},
  {L:0,  a:[-1,2],    f:()=>NM.backspread},
  {L:0,  a:[-1,3],    f:()=>NM.backspread},
  {L:1,  a:[-2,1],    f:()=>NM.putRatio},
  {L:-1, a:[2,-1],    f:()=>NM.putBack},
  {L:2,  a:[-1,-1],   f:()=>NM.trf},
  {L:0,  a:[1,-2,1],  f:(K,o)=>K[1]-K[0]===K[2]-K[1] ? (o.iron?NM.ironFly:NM.fly) : NM.brokenFly},
  {L:0,  a:[-1,2,-1], f:(K,o)=>o.iron?NM.revIronFly:NM.shortFly},
  {L:0,  a:[1,-1,-1], f:()=>NM.ladder},
  {L:1,  a:[-1,1,-1], f:()=>NM.seagull},
  {L:1,  a:[-1,-1,1], f:()=>NM.jade},
  {L:0,  a:[1,-1,-1,1], f:(K,o)=>o.iron?NM.ironCondor:NM.condor},
  {L:0,  a:[-1,1,1,-1], f:(K,o)=>o.iron?NM.revIronCondor:NM.shortCondor},
  {L:0,  a:[1,-2,2,-2,1], f:()=>NM.doubleFly},
];
function calPair(a, b){
  const ta = TYPES[a.t], tb = TYPES[b.t];
  if (ta.kind!==tb.kind || (a.m==='far')===(b.m==='far') || ta.sign===tb.sign || (a.q||1)!==(b.q||1)) return null;
  const far = a.m==='far' ? a : b, near = far===a ? b : a;
  if (TYPES[far.t].sign < 0) return far.K===near.K ? 'revCal' : null;
  return far.K===near.K ? 'cal' : 'diag';
}
function stratName(ps){
  if (!ps.length) return null;
  if (ps.some(p=>p.m==='far')){
    if (ps.some(p=>!['call','put'].includes(TYPES[p.t].kind))) return null;
    if (ps.length===2){ const r = calPair(ps[0], ps[1]); return r ? NM[r] : null; }
    if (ps.length===4){
      for (const [i,j,k,l] of [[0,1,2,3],[0,2,1,3],[0,3,1,2]]){
        const r1 = calPair(ps[i],ps[j]), r2 = calPair(ps[k],ps[l]);
        if (r1 && r2 && r1!=='revCal' && r2!=='revCal') return NM[r1==='cal'&&r2==='cal' ? 'dblCal' : 'dblDiag'];
      }
    }
    return null;
  }
  const s = kinkSig(ps); if (!s) return null;
  const has = k => ps.some(p=>TYPES[p.t].kind===k);
  const o = {iron: has('call') && has('put'), stock: has('stock')};
  for (const r of RULES){
    if (r.a.length !== s.a.length) continue;

   story:'在圖上按住拖曳，畫出你想要的「到期報酬」形狀，程式會反推需要哪些選擇權。試試半圓：看看兩端的口數會發生什麼事。',
   target:null, hint:'規則只有一條：線在某個履約價轉彎多少，就要在那裡買（往上彎）或賣（往下彎）多少口。半圓越靠近邊緣越陡，所以口數會暴增。'},
  {pts:2, title:'自由模式', cal:true, story:'沒有目標，隨意組合，看看你能拼出什麼形狀。選擇權可以切換近月／遠月；拼出著名組合時，下方會顯示它的名字。', target:null, hint:'試試看：只用賣權能不能拼出多頭價差？', lesson:''},
];

let lv = 0, board = [], solved = new Set(), uid = 0, hintsUsed = 0, scored = false;
let best = {};
// 成績由伺服器提供（見 /static/optpuzzle-session.js）
best = Object.assign({}, window.OPT_INIT_BEST || {}); Object.keys(best).forEach(k=>solved.add(+k));

const $ = id => document.getElementById(id);
const BASE_TIP = $('trayTip').innerHTML, CAL_TIP = "現價 S₀ = 100　波動率 25%　利率 0<br><b>近月</b> 3 個月、<b>遠月</b> 6 個月到期。圖上是<b>近月到期那天</b>的損益；遠月那片還沒到期，用 Black-Scholes 估當天價值（假設波動率不變）。";

function miniSVG(t){
  const p = {t, K:100}, pts=[];
  const vals=[]; for(let S=70;S<=130;S+=2) vals.push(pnl(p,S));
  const m = Math.max(...vals.map(Math.abs));
  vals.forEach((v,i)=>pts.push(`${(i/(vals.length-1))*100},${19 - v/m*15}`));
  return `<svg viewBox="0 0 100 38" preserveAspectRatio="none"><line x1="0" y1="19" x2="100" y2="19" stroke="#ddd" stroke-width="1"/><polyline points="${pts.join(' ')}" fill="none" stroke="currentColor" stroke-width="3" vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg>`;
}

function renderTray(){
  const banned = LEVELS[lv].banned || [];
  $('tray').innerHTML = ORDER.map(t=>{
    const d = TYPES[t], b = banned.includes(t);
    return `<div class="piece ${d.cls} ${b?'banned':''}" draggable="${!b}" data-t="${t}"><div class="nm">${d.nm}</div><div class="en">${d.en}</div>${miniSVG(t)}</div>`;
  }).join('');
  $('tray').querySelectorAll('.piece').forEach(el=>{
    const t = el.dataset.t;
    if (el.classList.contains('banned')) return;
    el.addEventListener('dragstart', e=>{ e.dataTransfer.setData('text/plain', t); });
    el.addEventListener('click', ()=>addPiece(t));
  });
}

function addPiece(t){
  if ((LEVELS[lv].banned||[]).includes(t)) return;
  board.push({id:++uid, t, K:100, q:1});
  update();
}

function renderBoard(){
  const d = $('drop');
  if (!board.length){ d.innerHTML = '<div class="empty">把零件拖到這裡，或在左邊點一下</div>'; return; }
  d.innerHTML = board.map(p=>{
    const ty = TYPES[p.t];
    const strike = ty.kind==='stock' ? '' :
      `<select data-id="${p.id}">${STRIKES.map(k=>`<option ${k===p.K?'selected':''}>${k}</option>`).join('')}</select>`;
    const mat = (LEVELS[lv].cal && (ty.kind==='call'||ty.kind==='put')) ?
      `<select data-mid="${p.id}"><option value="near" ${p.m!=='far'?'selected':''}>近月</option><option value="far" ${p.m==='far'?'selected':''}>遠月</option></select>` : '';
    const prem = ty.kind==='stock' ? `成本 ${S0}` :
      `${ty.sign>0?'付':'收'} ${priceOf(p).toFixed(2)}`;
    return `<div class="placed ${ty.cls} ${p.m==='far'?'far':''}"><div><div class="nm">${ty.nm} ${strike} ${mat}</div><div class="prem">${prem}</div></div>
      <div class="qty"><button data-dq="-1" data-id="${p.id}">−</button><span>×${p.q}</span><button data-dq="1" data-id="${p.id}">+</button></div>
      <button class="x" data-rm="${p.id}" title="移除">✕</button></div>`;
  }).join('');
  d.querySelectorAll('select[data-id]').forEach(s=>s.addEventListener('change',e=>{
    board.find(p=>p.id==s.dataset.id).K = +s.value; update();
  }));
  d.querySelectorAll('select[data-mid]').forEach(s=>s.addEventListener('change',e=>{
    board.find(p=>p.id==s.dataset.mid).m = s.value; update();
  }));
  d.querySelectorAll('[data-dq]').forEach(b=>b.addEventListener('click',()=>{
    const p = board.find(p=>p.id==b.dataset.id); p.q = Math.max(0.5, Math.min(5, p.q + 0.5 * +b.dataset.dq)); update();
  }));
  d.querySelectorAll('[data-rm]').forEach(b=>b.addEventListener('click',()=>{
    board = board.filter(p=>p.id!=b.dataset.rm); update();
  }));
}

function grid(){ const a=[]; for(let S=XMIN;S<=XMAX;S+=0.5) a.push(S); return a; }

function renderChart(){
  const tgt = LEVELS[lv].target;
  const xs = grid();
  const sumV = xs.map(S=>total(board,S));
  const tgtV = tgt ? xs.map(S=>total(tgt,S)) : null;
  const pieceV = board.map(p=>xs.map(S=>pnl(p,S)));
  let all = [...sumV, ...(tgtV||[]), ...pieceV.flat()];
  let ymax = Math.max(10, ...all), ymin = Math.min(-10, ...all);
  const pad = (ymax-ymin)*0.08; ymax+=pad; ymin-=pad;
  const W=720,H=360,L=48,R=14,Tp=14,B=34;
  const X = S => L + (S-XMIN)/(XMAX-XMIN)*(W-L-R);
  const Y = v => Tp + (ymax-v)/(ymax-ymin)*(H-Tp-B);
  const path = arr => arr.map((v,i)=>`${i?'L':'M'}${X(xs[i]).toFixed(1)},${Y(v).toFixed(1)}`).join('');
  let g = '';
  // y ticks
  const step = niceStep((ymax-ymin)/6);
  for (let v=Math.ceil(ymin/step)*step; v<=ymax; v+=step){
    g += `<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="${Math.abs(v)<1e-9?'#8a8f99':'#efe9dc'}" stroke-width="${Math.abs(v)<1e-9?1.2:1}"/>`;
    g += `<text x="${L-6}" y="${Y(v)+4}" text-anchor="end" font-size="11" fill="#8a8f99">${+v.toFixed(1)}</text>`;
  }
  STRIKES.forEach(k=>{
    g += `<line x1="${X(k)}" x2="${X(k)}" y1="${Tp}" y2="${H-B}" stroke="#efe9dc"/>`;
    if (k%10===0) g += `<text x="${X(k)}" y="${H-B+16}" text-anchor="middle" font-size="11" fill="#8a8f99">${k}</text>`;
  });
  g += `<text x="${W-R}" y="${H-4}" text-anchor="end" font-size="11" fill="#8a8f99">${LEVELS[lv].cal ? '近月到期時的股價 →' : '到期股價 →'}</text>`;
  g += `<text x="${L}" y="${H-4}" font-size="11" fill="#8a8f99">${XMIN}</text>`;
  const colors = {call:'#9db8e8', put:'#e8a993', stock:'#94cfae', digital:'#c3a6ec'};
  pieceV.forEach((arr,i)=>{ g += `<path d="${path(arr)}" fill="none" stroke="${colors[TYPES[board[i].t].kind]}" stroke-width="2" opacity=".75"/>`; });
  if (tgtV) g += `<path d="${path(tgtV)}" fill="none" stroke="var(--target)" stroke-width="7" stroke-dasharray="10 8" stroke-linecap="round" opacity=".55"/>`;
  if (board.length) g += `<path d="${path(sumV)}" fill="none" stroke="${isSolved()?'var(--ok)':'var(--sum)'}" stroke-width="3.2" stroke-linejoin="round"/>`;
  $('chart').innerHTML = g;
}
function niceStep(x){ const p = Math.pow(10,Math.floor(Math.log10(x))); const f=x/p; return (f<1.5?1:f<3?2:f<7?5:10)*p; }

function isSolved(){
  const tgt = LEVELS[lv].target;
  if (!tgt || !board.length) return false;
  if ((LEVELS[lv].banned||[]).some(b=>board.some(p=>p.t===b))) return false;
  return grid().every(S=>Math.abs(total(board,S)-total(tgt,S))<0.02);
}

function renderStats(){
  if (!board.length){ ['stMax','stMin','stBe'].forEach(i=>$(i).textContent='—'); return; }
  const xs = []; for(let S=0;S<=400;S+=0.25) xs.push(S);
  const v = xs.map(S=>total(board,S));
  const slopeR = total(board,1001)-total(board,1000);
  const fmt = n => (n>=0?'+':'')+n.toFixed(2);
  $('stMax').textContent = slopeR>1e-6 ? '無上限' : fmt(Math.max(...v));
  $('stMin').textContent = slopeR<-1e-6 ? '無下限 ⚠' : fmt(Math.min(...v));
  const be=[];
  for(let i=1;i<xs.length;i++){
    if ((v[i-1]<0&&v[i]>=0)||(v[i-1]>0&&v[i]<=0)){
      const r = xs[i-1] + (0-v[i-1])/(v[i]-v[i-1])*(xs[i]-xs[i-1]);
      if (!be.length || Math.abs(be[be.length-1]-r)>0.3) be.push(r);
    }
  }
  $('stBe').textContent = be.length ? be.map(x=>x.toFixed(1)).join('、') : (v.every(a=>Math.abs(a)<1e-6)?'恆為 0':'無');
}


const MAXPTS = 3;
const stars = n => '★'.repeat(n) + '☆'.repeat(MAXPTS-n);

// 本關得分 = 配分 × 星數 / 3（四捨五入）；畫畫、自由模式嘗試即得滿分

function update(){
  if (LEVELS[lv].draw){ renderDraw(); $('named').classList.remove('show');
    $('win').innerHTML = solved.has(lv) ? `<b>✏️ 已嘗試畫畫模式</b>　+${LEVELS[lv].pts} 分。試試不同形狀，看看口數怎麼變。` : `畫畫模式：在圖上按住拖曳，自己畫一條線，就能拿到 ${LEVELS[lv].pts} 分。`; $('win').classList.add('show');

  renderBoard(); renderChart(); renderStats(); renderName();
  const ok = isSolved(), L = LEVELS[lv];

      scored = true;
      const pts = Math.max(0, MAXPTS - hintsUsed);
      best[lv] = Math.max(best[lv]||0, pts); solved.add(lv);
      saveScore();
      renderLevelHead();

    $('win').innerHTML = `<b>拼對了！</b>　本關：<b>${stars(Math.max(0,MAXPTS-hintsUsed))}</b>（+${lvPts(lv, Math.max(0,MAXPTS-hintsUsed))} / ${L.pts} 分）<p>${L.lesson}</p>`;

/* ---------- 畫畫看 ---------- */
const DY = [-20, 40];               // fixed y range in draw mode
let drawVals = new Array(XMAX-XMIN+1).fill(0); // value at S = 60..140 step 1
let gap = 5, lastPt = null;
const CH = {W:720,H:360,L:48,R:14,Tp:14,B:34};
const dX = S => CH.L + (S-XMIN)/(XMAX-XMIN)*(CH.W-CH.L-CH.R);
const dY = v => CH.Tp + (DY[1]-v)/(DY[1]-DY[0])*(CH.H-CH.Tp-CH.B);
const invX = x => XMIN + (x-CH.L)/(CH.W-CH.L-CH.R)*(XMAX-XMIN);
const invY = y => DY[1] - (y-CH.Tp)/(CH.H-CH.Tp-CH.B)*(DY[1]-DY[0]);
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
function drawAt(S){ // linear interp of drawn curve
  S = clamp(S, XMIN, XMAX); const i = Math.floor(S-XMIN), f = S-XMIN-i;
  return i>=drawVals.length-1 ? drawVals[drawVals.length-1] : drawVals[i]*(1-f)+drawVals[i+1]*f;
}
function strikesGrid(){ const a=[]; for(let k=XMIN;k<=XMAX+1e-9;k+=gap) a.push(+k.toFixed(4)); return a; }

// Carr-Madan style static replication on a discrete grid:
// f(S) = f(S0) + f'(S0)(S-S0) + Σ_{K<S0} Δslope_K · Put(K) + Σ_{K≥S0} Δslope_K · Call(K)
// flat outside the drawing range.
function recipe(){
  const Ks = strikesGrid(), f = Ks.map(drawAt);
  const seg = []; for(let i=0;i<Ks.length-1;i++) seg.push((f[i+1]-f[i])/(Ks[i+1]-Ks[i]));
  const legs = Ks.map((K,i)=>{
    const sl = i===0 ? 0 : seg[i-1], sr = i===Ks.length-1 ? 0 : seg[i];
    return {K, q: sr - sl, kind: K < S0 ? 'put' : 'call'};
  }).filter(l=>Math.abs(l.q)>1e-9);
  const i0 = Ks.findIndex(k=>Math.abs(k-S0)<1e-9);
  const stock = i0>0 ? seg[i0-1] : 0;
  const cash = drawAt(S0);
  const cost = cash + legs.reduce((a,l)=>a + l.q*(l.kind==='call'?callPx(l.K):putPx(l.K)), 0);
  const payoff = S => cash + stock*(S-S0) + legs.reduce((a,l)=>a + l.q*(l.kind==='call'?Math.max(S-l.K,0):Math.max(l.K-S,0)), 0);
  return {Ks, legs, stock, cash, cost, payoff};
}

function renderDraw(){
  const r = recipe();
  let g = '';
  for (let v=DY[0]; v<=DY[1]; v+=10){
    g += `<line x1="${CH.L}" x2="${CH.W-CH.R}" y1="${dY(v)}" y2="${dY(v)}" stroke="${v===0?'#8a8f99':'#efe9dc'}" stroke-width="${v===0?1.2:1}"/>`;
    g += `<text x="${CH.L-6}" y="${dY(v)+4}" text-anchor="end" font-size="11" fill="#8a8f99">${v}</text>`;
  }
  r.Ks.forEach(k=>{ g += `<line x1="${dX(k)}" x2="${dX(k)}" y1="${CH.Tp}" y2="${CH.H-CH.B}" stroke="#e6e1d6" stroke-width="${gap>=5?1:.6}"/>`; });
  for (let k=XMIN;k<=XMAX;k+=10) g += `<text x="${dX(k)}" y="${CH.H-CH.B+16}" text-anchor="middle" font-size="11" fill="#8a8f99">${k}</text>`;
  g += `<text x="${CH.W-CH.R}" y="${CH.H-4}" text-anchor="end" font-size="11" fill="#8a8f99">到期股價 →</text>`;
  g += `<text x="${CH.L+4}" y="${CH.Tp+12}" font-size="11" fill="#8a8f99">到期報酬（未扣成本）</text>`;
  const dp = drawVals.map((v,i)=>`${i?'L':'M'}${dX(XMIN+i).toFixed(1)},${dY(v).toFixed(1)}`).join('');
  g += `<path d="${dp}" fill="none" stroke="var(--target)" stroke-width="7" stroke-dasharray="10 8" stroke-linecap="round" opacity=".55"/>`;
  const ap = r.Ks.map((k,i)=>`${i?'L':'M'}${dX(k).toFixed(1)},${dY(r.payoff(k)).toFixed(1)}`).join('');
  g += `<path d="${ap}" fill="none" stroke="var(--sum)" stroke-width="3.2" stroke-linejoin="round"/>`;
  r.Ks.forEach(k=>{ g += `<circle cx="${dX(k)}" cy="${dY(r.payoff(k))}" r="${gap>=5?3:1.8}" fill="var(--sum)"/>`; });
  g += `<rect x="${CH.L}" y="${CH.Tp}" width="${CH.W-CH.L-CH.R}" height="${CH.H-CH.Tp-CH.B}" fill="transparent"/>`;
  $('chart').innerHTML = g;

  // quantity bars
  const W=720,H=200,L=48,R=14,mid=100;
  const qmax = Math.max(1, ...r.legs.map(l=>Math.abs(l.q)));
  const bw = Math.max(2, (W-L-R)/((XMAX-XMIN)/gap+1)*0.6);
  let q = `<line x1="${L}" x2="${W-R}" y1="${mid}" y2="${mid}" stroke="#8a8f99"/>`;
  q += `<text x="${L-6}" y="${18}" text-anchor="end" font-size="11" fill="#8a8f99">+${+qmax.toFixed(2)}</text>`;
  q += `<text x="${L-6}" y="${H-10}" text-anchor="end" font-size="11" fill="#8a8f99">−${+qmax.toFixed(2)}</text>`;
  q += `<text x="${L+4}" y="${H-6}" font-size="11" fill="#d2542f">← 賣權（Put）</text><text x="${W-R}" y="${H-6}" text-anchor="end" font-size="11" fill="#2f6fd6">買權（Call）→</text>`;
  r.legs.forEach(l=>{
    const x = L + (l.K-XMIN)/(XMAX-XMIN)*(W-L-R), h = l.q/qmax*85;
    q += `<rect x="${x-bw/2}" y="${h>0?mid-h:mid}" width="${bw}" height="${Math.abs(h)}" rx="2" fill="${l.kind==='call'?'#2f6fd6':'#d2542f'}" opacity="${l.q>0?1:.55}"/>`;
  });
  $('qchart').innerHTML = q;

  // recipe list
  const fq = n => (+Math.abs(n).toFixed(2)).toString();
  let items = [];
  if (Math.abs(r.cash)>1e-6) items.push(`<div>${r.cash>0?'存入':'借入'}現金 <b>${fq(r.cash)}</b></div>`);
  if (Math.abs(r.stock)>1e-6) items.push(`<div class="${r.stock>0?'buy':'sell'}">${r.stock>0?'買進':'放空'}現貨 <b>${fq(r.stock)}</b> 股</div>`);
  r.legs.forEach(l=>items.push(`<div class="${l.q>0?'buy':'sell'}">${l.q>0?'買進':'賣出'} ${l.K} ${l.kind==='call'?'買權':'賣權'} <b>×${fq(l.q)}</b></div>`));
  $('recipe').innerHTML = items.length ? items.join('') : '<div>線是平的，什麼都不用買。</div>';

  const totalQ = r.legs.reduce((a,l)=>a+Math.abs(l.q),0);
  const big = r.legs.reduce((m,l)=>Math.abs(l.q)>Math.abs(m.q)?l:m, {q:0});
  $('stMax').textContent = (r.cost>=0?'付 ':'收 ') + Math.abs(r.cost).toFixed(2);
  $('stMin').textContent = totalQ.toFixed(2) + ' 口';
  $('stBe').textContent = big.K ? `${big.K}：${fq(big.q)} 口` : '—';
  $('drawNote').textContent = r.legs.length
    ? `口數可以是小數，把它想成放大倍數。現貨部位以借款買進，所以淨成本是 0。今天總成本 = 現金 + 各選擇權權利金。`
    : '';
}

function svgPt(e){
  const pt = $('chart').createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
  const p = pt.matrixTransform($('chart').getScreenCTM().inverse());
  return {S: clamp(invX(p.x), XMIN, XMAX), v: clamp(invY(p.y), DY[0], DY[1])};
}
function paint(a, b){
  const s0 = Math.round(Math.min(a.S,b.S)), s1 = Math.round(Math.max(a.S,b.S));
  for (let S=s0; S<=s1; S++){
    const t = a.S===b.S ? 1 : (S-a.S)/(b.S-a.S);
    drawVals[S-XMIN] = a.v + (b.v-a.v)*clamp(t,0,1);
  }
}
$('chart').addEventListener('pointerdown', e=>{
  if (!LEVELS[lv].draw) return;
  $('chart').setPointerCapture(e.pointerId);
  lastPt = svgPt(e); paint(lastPt,lastPt); renderDraw();
  if (!solved.has(lv)){ awardTry(); update(); }
});
$('chart').addEventListener('pointermove', e=>{
  if (!LEVELS[lv].draw || !lastPt) return;
  const p = svgPt(e); paint(lastPt,p); lastPt = p; renderDraw();
});
['pointerup','pointercancel'].forEach(ev=>$('chart').addEventListener(ev, ()=>{ lastPt = null; }));

const PRESETS = {
  semi: S => Math.abs(S-100)<=40 ? Math.sqrt(1600-(S-100)**2)*0.75 : 0,
  smile: S => 0.02*(S-100)**2 - 10,
  step: S => S<100 ? 0 : 20,
  saw: S => ((S-60)%20)*1.25 - 5,
  sine: S => 15*Math.sin((S-60)/80*4*Math.PI) + 10,
  cake: S => (Math.abs(S-100)<=28?12:0) + (Math.abs(S-100)<=16?12:0) + (Math.abs(S-100)<=1?10:0),
  zero: S => 0,
};
document.querySelectorAll('[data-pre]').forEach(b=>b.addEventListener('click',()=>{
  const fn = PRESETS[b.dataset.pre];
  drawVals = drawVals.map((_,i)=>clamp(fn(XMIN+i), DY[0], DY[1])); renderDraw();
}));
function setGap(g){ gap = g; document.querySelectorAll('#gapSeg button').forEach(b=>b.classList.toggle('on', +b.dataset.gap===g)); if (LEVELS[lv].draw) renderDraw(); }
document.querySelectorAll('#gapSeg button').forEach(b=>b.addEventListener('click',()=>setGap(+b.dataset.gap)));
setGap(5);
drawVals = drawVals.map((_,i)=>PRESETS.semi(XMIN+i));


goLevel(0);
</script>
</body>
