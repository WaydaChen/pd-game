<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>商銀行長的第一年 — 教師成績</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#f6f4ef;--paper:#fff;--ink:#1f2328;--muted:#6b6f76;--line:#e3e0d8;--accent:#1d4e89;--bad:#b3261e}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC",system-ui,sans-serif;line-height:1.5}
  .wrap{max-width:1200px;margin:0 auto;padding:24px 16px 48px}
  h1{font-size:24px;margin:0 0 4px}
  .sub{color:var(--muted);font-size:14px;margin:0 0 18px}
  .card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
  .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  input{font:inherit;padding:8px 10px;border:1.5px solid var(--line);border-radius:10px;background:#fff;min-width:0}
  button,a.btn{font:inherit;font-size:14px;border:1.5px solid var(--accent);background:var(--accent);color:#fff;border-radius:10px;padding:8px 14px;cursor:pointer;text-decoration:none}
  .ghost{background:#fff !important;color:var(--accent) !important;border-color:var(--line) !important}
  .link{font-family:ui-monospace,monospace;font-size:14px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 10px;word-break:break-all}
  .stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
  .stat{background:#faf9f6;border:1px solid var(--line);border-radius:10px;padding:8px 14px}
  .stat .k{font-size:12px;color:var(--muted)} .stat .v{font-size:20px;font-weight:700}
  .tbl{overflow-x:auto}
  table{border-collapse:collapse;width:100%;font-size:14px;background:#fff}
  th,td{border-bottom:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
  th{font-size:12px;color:var(--muted);cursor:pointer;user-select:none;white-space:nowrap}
  td{white-space:nowrap} td.q{white-space:normal;min-width:260px;max-width:420px}
  td.n{text-align:right;font-variant-numeric:tabular-nums}
  .err{color:var(--bad);font-size:13px}
  .muted{color:var(--muted);font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <h1>🏦 商銀行長的第一年 · 教師成績</h1>
  <p class="sub">學生登記系級、學號、姓名後開始；結算時寫下問題並送出。每位學生保留最高分那一次（含當次的問題），每次送出都另有完整紀錄。</p>

  <div class="card">
    <div class="row" style="align-items:flex-start;gap:18px">
      <img id="qrImg" alt="學生入口 QR code" width="180" height="180" style="display:block;border:1px solid var(--line);border-radius:10px;cursor:zoom-in;background:#fff">
      <div style="flex:1;min-width:220px">
        <div class="muted" style="margin-bottom:6px">學生入口：請同學掃 QR code，或輸入網址</div>
        <div class="row"><span class="link" id="stuLink"></span><button class="ghost" id="copyBtn">複製</button><a class="btn ghost" href="/bank-ceo" target="_blank">開啟</a></div>
        <p style="margin-top:10px"><button id="bigBtn">🔍 全螢幕投影 QR code</button></p>
      </div>
    </div>
  </div>

  <div id="qrBig" style="display:none;position:fixed;inset:0;z-index:100;background:#fff;flex-direction:column;align-items:center;justify-content:center;gap:16px;cursor:zoom-out;padding:16px">
    <div style="font-size:clamp(22px,4vw,40px);font-weight:700">🏦 商銀行長的第一年｜掃描開始</div>
    <img id="qrBigImg" alt="學生入口 QR code" style="width:min(70vh,90vw);height:min(70vh,90vw)">
    <div class="link" id="qrBigUrl" style="font-size:clamp(16px,2.4vw,26px)"></div>
    <div class="muted">點一下或按 Esc 關閉</div>
  </div>

  <div class="card">
    <div class="row">
      <a class="btn" href="/api/bankceo/export.csv">下載成績 CSV（每人最高分）</a>
      <a class="btn ghost" href="/api/bankceo/attempts.csv">下載每次送出紀錄 CSV</a>
      <a class="btn ghost" href="/api/bankceo/attendance.csv">下載點名紀錄 CSV</a>
      <label class="muted"><input type="checkbox" id="auto" checked> 每 10 秒自動更新</label>
    </div>
    <p class="err" id="err"></p>
  </div>

  <div class="card" id="out" style="display:none">
    <div class="stats" id="stats"></div>
    <input id="q" placeholder="搜尋系級 / 學號 / 姓名 / 問題" style="width:100%;max-width:320px;margin-bottom:10px">
    <div class="tbl"><table><thead><tr id="head"></tr></thead><tbody id="body"></tbody></table></div>
  </div>
</div>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const stu = location.origin + '/bank-ceo';
$('stuLink').textContent = stu;
$('copyBtn').onclick = () => navigator.clipboard && navigator.clipboard.writeText(stu);
const qr = size => `https://api.qrserver.com/v1/create-qr-code/?size=${size}x${size}&margin=10&data=${encodeURIComponent(stu)}`;
$('qrImg').src = qr(360);
$('qrBigImg').src = qr(800);
$('qrBigUrl').textContent = stu;
const showBig = on => { $('qrBig').style.display = on ? 'flex' : 'none'; };
$('qrImg').onclick = $('bigBtn').onclick = () => showBig(true);
$('qrBig').onclick = () => showBig(false);
document.addEventListener('keydown', e => { if (e.key === 'Escape') showBig(false); });

// 每列攤平：最高分那一次的欄位
const COLS = [
  ['dept','系級'],['sid','學號'],['name','姓名'],['last_login','最後登入'],
  ['score','最高分',1],['end','結局'],['camels','CAMELS'],['wrong','答錯',1],
  ['plays','次數',1],['last_score','最近一次',1],['updated_at','最後送出'],['question','學生的問題（最高分那次）'],
];
let rows = [], sortKey = 'sid', sortDir = 1, timer = null;

function fmt(iso){ try{ return new Date(iso).toLocaleString('zh-TW',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});}catch(e){return iso;} }
function isToday(iso){ if(!iso) return false; const d=new Date(iso), t=new Date(); return d.toDateString()===t.toDateString(); }
function flat(r){
  const b = r.best || {}, cm = b.camels || {};
  return {dept:r.dept, sid:r.sid, name:r.name, plays:r.plays||0, updated_at:r.best ? r.updated_at : '',
    score:b.score ?? -1, end:b.end_key ? `${b.end_key} ${b.end}` : '', wrong:b.wrong ?? 0,
    camels: 'CAMELS'.split('').map(k=>cm[k] ?? '-').join('') + (b.comp ? `（${b.comp}）` : ''),
    last_score:(r.last||{}).score ?? '', question:b.question || '',
    last_login:r.last_login || '', today: isToday(r.last_login), submitted: !!r.best};
}

function render(){
  $('head').innerHTML = COLS.map(([k,l])=>`<th data-k="${k}">${l}${sortKey===k?(sortDir>0?' ▲':' ▼'):''}</th>`).join('');
  $('head').querySelectorAll('th').forEach(th=>th.onclick=()=>{ const k=th.dataset.k; sortDir = sortKey===k ? -sortDir : 1; sortKey=k; render(); });
  const q = $('q').value.trim().toLowerCase();
  const list = rows.filter(r=>!q || [r.dept,r.sid,r.name,r.question].join(' ').toLowerCase().includes(q))
    .sort((a,b)=>{ const x=a[sortKey], y=b[sortKey]; return (typeof x==='number' ? x-y : String(x??'').localeCompare(String(y??''),'zh-Hant'))*sortDir; });
  $('body').innerHTML = list.map(r=>`<tr>${COLS.map(([k,,n])=>{
    let v = r[k];
    if ((k==='updated_at' || k==='last_login') && v) v = fmt(v);
    if (k==='score' && !r.submitted) v = '尚未送出';
    return `<td class="${n?'n':''}${k==='question'?' q':''}">${esc(v)}</td>`; }).join('')}</tr>`).join('')
    || `<tr><td colspan="${COLS.length}" class="muted">尚無資料</td></tr>`;
  const sub = rows.filter(r=>r.submitted), n = sub.length, avg = n ? sub.reduce((a,r)=>a+Math.max(0,r.score),0)/n : 0;
  const todayN = rows.filter(r=>r.today).length, todaySub = rows.filter(r=>r.today && r.submitted).length;
  const ends = {}; sub.forEach(r=>{ const e=(r.end||'').split(' ')[0]; if(e) ends[e]=(ends[e]||0)+1; });
  $('stats').innerHTML = `<div class="stat"><div class="k">今天已登入（點名）</div><div class="v">${todayN}</div></div>
    <div class="stat"><div class="k">今天登入且已送出</div><div class="v">${todaySub}</div></div>
    <div class="stat"><div class="k">累計送出人數</div><div class="v">${n}</div></div>
    <div class="stat"><div class="k">最高分平均</div><div class="v">${avg.toFixed(1)}</div></div>
    <div class="stat"><div class="k">結局分布（最高分那次）</div><div class="v" style="font-size:15px">${Object.entries(ends).sort().map(([k,c])=>`${k}×${c}`).join('　')||'—'}</div></div>`;
}

async function load(){
  try {
    const res = await fetch('/api/bankceo/records');
    const d = await res.json();
    if (!res.ok) throw new Error(d.detail || res.status);
    rows = d.records.map(flat); $('err').textContent = ''; $('out').style.display = '';
    render();
  } catch(e){ $('err').textContent = '讀取失敗：' + e.message; }
}
function schedule(){ clearInterval(timer); if ($('auto').checked) timer = setInterval(load, 10000); }
$('auto').onchange = schedule;
$('q').oninput = render;
load(); schedule();
</script>
</body>
</html>
